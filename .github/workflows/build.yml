name: Build mod jars

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [fabric, trophyheads, topdowncamera]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-1.21.11
          path: |
            ${{ matrix.mod }}/build/libs/*.jar
            !${{ matrix.mod }}/build/libs/*-sources.jar
